[package]
name = "j4v"
version = "0.1.0"
edition = "2021"
description = "A TUI web browser — any website, rendered as a pure terminal interface"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
